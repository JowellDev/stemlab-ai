# Stack de developpement complete. `docker compose up -d` depuis infra/.
#
# Note : sur un poste sans Docker, `pnpm services` (scripts/dev-services.sh)
# demarre les memes services en userspace sur les memes ports.
name: stemlab

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stemlab
      POSTGRES_PASSWORD: stemlab
      POSTGRES_DB: stemlab
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stemlab -d stemlab']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '56379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Depuis quay.io, et epingle. MinIO a retire les tags `latest` de Docker Hub :
    # `minio/minio:latest` y renvoie desormais « manifest unknown », et le `pull`
    # echoue. Son propre registre les publie toujours.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':59001']
    environment:
      MINIO_ROOT_USER: stemlab-dev
      MINIO_ROOT_PASSWORD: stemlab-dev-secret
    ports:
      - '59000:9000'
      - '59001:59001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Cree le bucket applicatif une fois MinIO pret, puis sort.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 stemlab-dev stemlab-dev-secret &&
      mc mb --ignore-existing local/stemlab &&
      mc anonymous set none local/stemlab &&
      echo 'bucket stemlab pret'
      "

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      target: dev
    restart: unless-stopped
    command: ['pnpm', '--filter', '@stemlab/web', 'dev', '--host', '0.0.0.0']
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql://stemlab:stemlab@postgres:5432/stemlab?schema=public
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      ML_API_URL: http://api:8000
    ports:
      - '3000:3000'
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages:/app/packages
      - web-node-modules:/app/node_modules
      # Ces deux repertoires sont ecrits par le conteneur, qui tourne en root.
      # Sans volume dedie, ils atterrissent dans l'arborescence hote avec des
      # droits que l'utilisateur ne peut plus effacer : `pnpm dev` echoue alors
      # sur un `EACCES` a la suppression, hors de tout conteneur.
      - web-vite-cache:/app/apps/web/node_modules/.vite
      - web-route-types:/app/apps/web/.react-router
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.ml
      target: dev
    restart: unless-stopped
    command:
      ['uv', 'run', 'uvicorn', 'ml.api:app', '--host', '0.0.0.0', '--port', '8000', '--reload']
    env_file: [../.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      ML_WEBHOOK_URL: http://web:3000/api/internal/jobs/callback
    ports:
      - '8000:8000'
    volumes:
      - ../apps/ml:/app
      # Meme raison : l'environnement virtuel cree dans le conteneur pointe vers
      # l'interpreteur du conteneur, et appartient a root. Laisse sur l'hote, il
      # rend `uv run` inutilisable — l'interpreteur n'existe pas, et `uv` ne peut
      # pas remplacer un repertoire qui ne lui appartient pas.
      - ml-venv:/app/.venv
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.ml
      target: dev
    restart: unless-stopped
    command: ['uv', 'run', 'arq', 'ml.worker.WorkerSettings']
    env_file: [../.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      ML_WEBHOOK_URL: http://web:3000/api/internal/jobs/callback
    volumes:
      - ../apps/ml:/app
      - demucs-models:/root/.cache/torch
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  minio-data:
  web-node-modules:
  demucs-models:
  # Artefacts produits par les conteneurs. Ils ont leur propre volume pour ne
  # jamais se retrouver dans l'arborescence de travail, ou leurs droits root
  # bloqueraient les outils lances hors conteneur.
  web-vite-cache:
  web-route-types:
  ml-venv:
