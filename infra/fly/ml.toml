# Service ML : l'API qui recoit les jobs et les met en file.
#
# Le worker, lui, ne vit pas ici : il tourne sur Modal, ou le GPU s'eteint a vide
# (voir `infra/modal/`). Cette machine ne fait que valider une signature et
# pousser dans Redis — elle n'a besoin ni de GPU ni de beaucoup de memoire.

app = "stemlab-ml"
primary_region = "cdg"

[build]
  dockerfile = "../Dockerfile.ml"
  build-target = "runtime"

[env]
  PYTHONUNBUFFERED = "1"
  TORCH_DEVICE = "cpu"

[http_service]
  internal_port = 8000
  force_https = true
  # L'API n'est jointe que par le BFF : elle peut dormir entre deux envois.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    # `/health` repond sans charger torch : une sonde ne doit pas payer le prix
    # d'un import de plusieurs secondes.
    path = "/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
