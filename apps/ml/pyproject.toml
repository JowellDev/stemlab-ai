[project]
name = "stemlab-ml"
version = "0.1.0"
description = "STEMLAB — service de separation de sources et d'analyse musicale"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "arq>=0.27.0",
    "httpx>=0.28.1",
    "boto3>=1.42.0",
    "structlog>=25.5.0",
    "numpy>=1.26,<2.0",
    "soundfile>=0.13.1",
]

[tool.uv]
default-groups = ["dev", "ml"]

# Le verrou du depot cible le CPU : c'est ce qui tourne en developpement et en CI.
# Les roues PyPI de torch embarquent les bibliotheques CUDA, soit environ 4 Go
# inutiles ici. Le worker GPU est construit par Modal (infra/modal/), qui installe
# la variante CUDA dans sa propre image.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[dependency-groups]
# Dependances lourdes du pipeline. En groupe plutot qu'en extra : `uv run`
# resynchronise l'environnement a chaque appel et retirerait un extra non demande,
# laissant le worker sans torch. Un groupe par defaut, lui, reste en place.
ml = [
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "demucs>=4.0.1",
    "essentia>=2.1b6.dev1110",
    # Transcription des paroles. `faster-whisper` (MIT) plutot que le paquet
    # `openai-whisper` : meme modele, execution par CTranslate2, plusieurs fois
    # plus rapide sur processeur — ce qui compte quand aucun GPU n'est garanti.
    "faster-whisper>=1.2.0",
    # Traduction francais <-> anglais. Les modeles OPUS-MT sont petits et sous
    # licence permissive, la ou NLLB-200 est non commercial — exclu par la meme
    # contrainte que madmom.
    "transformers>=4.57.0",
    "sentencepiece>=0.2.0",
    "sacremoses>=0.1.1",
]

dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    "types-boto3[s3]>=1.42.0",
    "fakeredis>=2.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Les scripts de developpement appellent ffmpeg depuis le PATH, avec des arguments
# entierement construits par le script. Ce n'est pas une surface d'injection.
"../../scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "demucs.*",
    "essentia.*",
    "torch.*",
    "torchaudio.*",
    "soundfile.*",
    "arq.*",
    "faster_whisper.*",
    "transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
